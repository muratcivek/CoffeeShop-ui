<h3>Kategoriler</h3>

<hr>

<table class="table table-hover">
  <thead>
    <tr>
    </tr>
  </thead>
  <tbody>
    @for (item of categories(); track $index) {
  <tr>
    <td>{{ $index + 1 }}</td>
    <td>{{ item.name }}</td>
    <td>
      <a class="btn btn-outline-danger">Sil</a>
      <a class="btn btn-outline-info">Güncelle</a>
    </td>
  </tr>
}
  </tbody>
</table>
<a routerLink="/admin/categories/create"
   class="btn btn-primary">
  Yeni Kategori Oluştur
</a>
